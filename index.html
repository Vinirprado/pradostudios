<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinicius Ramos | Identidade Visual Completa</title>
    <meta name="description" content="Designer especializado em criar identidades visuais completas que unem estratégia, estética e propósito. Transformo ideias em marcas memoráveis.">
    <meta name="author" content="Vinicius Ramos" />
    
    <!-- Resource hints for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Critical styles loading optimization -->
    <style>
      /* Critical above-the-fold styles to prevent FOUC */
      body { margin: 0; background-color: #0a0a0a; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
      .min-h-screen { min-height: 100vh; }
      
      /* Critical navigation styles */
      nav { 
        position: fixed; 
        top: 0; 
        left: 0; 
        right: 0; 
        z-index: 50; 
        padding: 1rem 1.5rem;
        background-color: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
      }
      
      /* Critical hero section styles */
      .hero-section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5rem 1.5rem 0;
        position: relative;
        overflow: hidden;
        background: linear-gradient(to bottom, #000, rgba(0,0,0,0.5), #0a0a0a);
      }
      
      .hero-content {
        text-align: center;
        max-width: 64rem;
        margin: 0 auto;
        position: relative;
        z-index: 20;
      }
      
      .hero-title {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 2rem;
        line-height: 1;
        color: #ffffff;
        text-shadow: 0 4px 8px rgba(0,0,0,0.5);
      }
      
      .hero-subtitle {
        font-size: 1.25rem;
        margin-bottom: 3rem;
        max-width: 32rem;
        margin-left: auto;
        margin-right: auto;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }
      
      .hero-button {
        display: inline-flex;
        align-items: center;
        padding: 0.75rem 1.5rem;
        background-color: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        color: #ffffff;
        text-decoration: none;
        border-radius: 0.5rem;
        transition: all 0.3s ease;
      }
      
      /* Fix touch target size for Lovable badge close button */
      #lovable-badge-close {
        min-width: 24px !important;
        min-height: 24px !important;
        padding: 4px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-sizing: border-box !important;
      }
      
      @media (min-width: 768px) {
        .hero-title { font-size: 4.5rem; }
      }
      
      @media (min-width: 1024px) {
        .hero-title { font-size: 6rem; }
      }
    </style>
    
    <!-- Font loading with improved performance -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"></noscript>
    
    <!-- Preload critical resources to reduce dependency chains -->
    <link rel="preload" href="/src/index.css" as="style">
    
    <!-- DNS prefetch for potential external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">

    <meta property="og:title" content="Vinicius Ramos | Identidade Visual Completa" />
    <meta property="og:description" content="Designer especializado em criar identidades visuais completas que unem estratégia, estética e propósito." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <link rel="icon" type="image/x-icon" href="https://storage.googleapis.com/gpt-engineer-file-uploads/2NuUHnjEqMgAoIyN94A5DQXhQKw1/uploads/1758211679127-Icone logo 2 - Transparente.png">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
